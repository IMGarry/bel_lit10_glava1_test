/* ================== ДАПАМОЖНЫЯ ФУНКЦЫІ ================== */

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let totalQuestions = 0;

function buildNav() {
  const nav = document.getElementById("section-nav");
  MC_SECTIONS.forEach((sec, idx) => {
    const btn = document.createElement("button");
    btn.textContent = sec.title.replace(/^\d+\.\s*/, "");
    btn.onclick = () => document.getElementById("sec-mc-" + idx).scrollIntoView({behavior:"smooth", block:"start"});
    nav.appendChild(btn);
  });
  const b1 = document.createElement("button");
  b1.textContent = "Паслядоўнасці";
  b1.onclick = () => document.getElementById("sec-order").scrollIntoView({behavior:"smooth"});
  nav.appendChild(b1);
  const b2 = document.createElement("button");
  b2.textContent = "Супастаўленне";
  b2.onclick = () => document.getElementById("sec-match").scrollIntoView({behavior:"smooth"});
  nav.appendChild(b2);
}

function buildMC() {
  const container = document.getElementById("mc-container");
  container.innerHTML = "";
  MC_SECTIONS.forEach((sec, sIdx) => {
    const block = document.createElement("section");
    block.className = "block";
    block.id = "sec-mc-" + sIdx;
    const h2 = document.createElement("h2");
    h2.textContent = sec.title;
    block.appendChild(h2);

    const qOrder = shuffle(sec.questions.map((_, i) => i));
    qOrder.forEach((qi, localIdx) => {
      const qd = sec.questions[qi];
      const qDiv = document.createElement("div");
      qDiv.className = "q";
      qDiv.dataset.type = "mc";
      qDiv.dataset.section = sIdx;
      qDiv.dataset.qindex = qi;

      const qt = document.createElement("div");
      qt.className = "qtext";
      qt.textContent = (localIdx+1) + ". " + qd.q;
      qDiv.appendChild(qt);

      const optsDiv = document.createElement("div");
      optsDiv.className = "options";
      const optOrder = shuffle(qd.opts.map((_, i) => i));
      const name = "mc-" + sIdx + "-" + qi;
      optOrder.forEach(oi => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = name;
        input.value = oi;
        label.appendChild(input);
        label.appendChild(document.createTextNode(qd.opts[oi]));
        optsDiv.appendChild(label);
      });
      qDiv.dataset.correct = qd.correct;
      qDiv.appendChild(optsDiv);

      const fb = document.createElement("div");
      fb.className = "feedback";
      fb.textContent = "💡 " + qd.exp;
      qDiv.appendChild(fb);

      block.appendChild(qDiv);
      totalQuestions++;
    });
    container.appendChild(block);
  });
}

  const container = document.getElementById("order-container");
  container.innerHTML = "";
  ORDER_QUESTIONS.forEach((oq, idx) => {
    const wrap = document.createElement("div");
    wrap.className = "q";
    wrap.dataset.type = "order";
    wrap.dataset.qindex = idx;

    const qt = document.createElement("div");
    qt.className = "qtext";
    qt.textContent = (idx+1) + ". " + oq.title;
    wrap.appendChild(qt);

    const shuffledIdx = shuffle(oq.items.map((_, i) => i));
    const list = document.createElement("ul");
    list.className = "order-list";
    shuffledIdx.forEach(itemIdx => {
      const li = document.createElement("li");
      li.dataset.correctPos = itemIdx;
      const span = document.createElement("span");
      span.textContent = oq.items[itemIdx];
      li.appendChild(span);
      const sel = document.createElement("select");
      for (let n = 1; n <= oq.items.length; n++) {
        const op = document.createElement("option");
        op.value = n;
        op.textContent = n;
        sel.appendChild(op);
      }
      sel.value = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "№?";
      placeholder.selected = true;
      placeholder.disabled = false;
      sel.insertBefore(placeholder, sel.firstChild);
      li.appendChild(sel);
      list.appendChild(li);
    });
    wrap.appendChild(list);

    const fb = document.createElement("div");
    fb.className = "feedback";
    fb.textContent = "💡 Правільная паслядоўнасць: " + oq.items.map((t,i)=> (i+1)+") "+t).join("; ");
    wrap.appendChild(fb);

    container.appendChild(wrap);
    totalQuestions++;
  });
}

function buildMatch() {
  const container = document.getElementById("match-container");
  container.innerHTML = "";
  MATCH_QUESTIONS.forEach((mq, idx) => {
    const wrap = document.createElement("div");
    wrap.className = "q";
    wrap.dataset.type = "match";
    wrap.dataset.qindex = idx;

    const qt = document.createElement("div");
    qt.className = "qtext";
    qt.textContent = (idx+1) + ". " + mq.title;
    wrap.appendChild(qt);

    const leftOrder = shuffle(mq.pairs.map((_, i) => i));
    const rightOrder = shuffle(mq.pairs.map((_, i) => i));

    const list = document.createElement("div");
    list.className = "match-list";
    leftOrder.forEach(li => {
      const row = document.createElement("div");
      row.className = "match-row";
      row.dataset.correctRight = li;
      const left = document.createElement("div");
      left.className = "left";
      left.textContent = mq.pairs[li][0];
      row.appendChild(left);
      const sel = document.createElement("select");
      const ph = document.createElement("option");
      ph.value = ""; ph.textContent = "— выберыце —"; ph.selected = true;
      sel.appendChild(ph);
      rightOrder.forEach(ri => {
        const op = document.createElement("option");
        op.value = ri;
        op.textContent = mq.pairs[ri][1];
        sel.appendChild(op);
      });
      row.appendChild(sel);
      list.appendChild(row);
    });
    wrap.appendChild(list);

    const fb = document.createElement("div");
    fb.className = "feedback";
    fb.textContent = "💡 Правільныя пары: " + mq.pairs.map(p => p[0]+" → "+p[1]).join("; ");
    wrap.appendChild(fb);

    container.appendChild(wrap);
    totalQuestions++;
  });
}

function checkAll() {
  let correctCount = 0;
  let answered = 0;

  document.querySelectorAll('.q[data-type="mc"]').forEach(qDiv => {
    const name = "mc-" + qDiv.dataset.section + "-" + qDiv.dataset.qindex;
    const checked = qDiv.querySelector('input[name="'+name+'"]:checked');
    const labels = qDiv.querySelectorAll(".options label");
    const correctVal = qDiv.dataset.correct;
    labels.forEach(l => l.classList.remove("opt-correct","opt-wrong"));
    const fb = qDiv.querySelector(".feedback");
    if (checked) {
      answered++;
      const chosenLabel = checked.closest("label");
      if (checked.value === correctVal) {
        chosenLabel.classList.add("opt-correct");
        correctCount++;
        fb.classList.add("show","correct"); fb.classList.remove("wrong");
      } else {
        chosenLabel.classList.add("opt-wrong");
        const correctInput = qDiv.querySelector('input[value="'+correctVal+'"]');
        if (correctInput) correctInput.closest("label").classList.add("opt-correct");
        fb.classList.add("show","wrong"); fb.classList.remove("correct");
      }
    } else {
      fb.classList.remove("show");
    }
  });

  document.querySelectorAll('.q[data-type="order"]').forEach(qDiv => {
    const items = qDiv.querySelectorAll(".order-list li");
    let allFilled = true, allCorrect = true;
    items.forEach(li => {
      const sel = li.querySelector("select");
      li.classList.remove("ord-correct","ord-wrong");
      if (!sel.value) { allFilled = false; return; }
      const chosenPos = parseInt(sel.value, 10) - 1;
      const correctPos = parseInt(li.dataset.correctPos, 10);
      if (chosenPos === correctPos) {
        li.classList.add("ord-correct");
      } else {
        li.classList.add("ord-wrong");
        allCorrect = false;
      }
    });
    const fb = qDiv.querySelector(".feedback");
    if (allFilled) {
      answered++;
      if (allCorrect) correctCount++;
      fb.classList.add("show");
    } else {
      fb.classList.remove("show");
    }
  });

  document.querySelectorAll('.q[data-type="match"]').forEach(qDiv => {
    const rows = qDiv.querySelectorAll(".match-row");
    let allFilled = true, allCorrect = true;
    rows.forEach(row => {
      const sel = row.querySelector("select");
      row.classList.remove("m-correct","m-wrong");
      if (!sel.value) { allFilled = false; return; }
      if (sel.value === row.dataset.correctRight) {
        row.classList.add("m-correct");
      } else {
        row.classList.add("m-wrong");
        allCorrect = false;
      }
    });
    const fb = qDiv.querySelector(".feedback");
    if (allFilled) {
      answered++;
      if (allCorrect) correctCount++;
      fb.classList.add("show");
    } else {
      fb.classList.remove("show");
    }
  });

  document.getElementById("score-box").textContent =
    "Адказана: " + answered + " / " + totalQuestions + " · Правільна: " + correctCount;

  const firstUnanswered = document.querySelector('.feedback.show');
}

function resetAll() {
  location.reload();
}

function toggleKey() {
  const key = document.getElementById("answer-key");
  if (!key.classList.contains("show")) {
    let html = "<h3>🔑 Поўны ключ адказаў</h3><ol>";
    MC_SECTIONS.forEach(sec => {
      html += "<li><strong>" + sec.title + "</strong><ol type='a'>";
      sec.questions.forEach(qd => {
        html += "<li>" + qd.q + " — <b>" + qd.opts[qd.correct] + "</b><br><span style='color:#7a6e68;font-size:.88em;'>" + qd.exp + "</span></li>";
      });
      html += "</ol></li>";
    });
    html += "</ol><h3>Паслядоўнасці</h3><ol>";
    ORDER_QUESTIONS.forEach(oq => {
      html += "<li>" + oq.title + "<br><b>" + oq.items.map((t,i)=>(i+1)+") "+t).join("; ") + "</b></li>";
    });
    html += "</ol><h3>Супастаўленне</h3><ol>";
    MATCH_QUESTIONS.forEach(mq => {
      html += "<li>" + mq.title + "<br><b>" + mq.pairs.map(p=>p[0]+" → "+p[1]).join("; ") + "</b></li>";
    });
    html += "</ol>";
    key.innerHTML = html;
  }
  key.classList.toggle("show");
}

buildNav();
buildMC();
buildOrder();
buildMatch();
</script>
